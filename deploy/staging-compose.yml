# Standalone isolated staging topology. Keep resource budgets aligned with docker-compose.yml.
name: ${EVALDIFF_STAGING_PROJECT:?Set an isolated evaldiff-staging project}

# Bound local container logs to about 30 MiB per service.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- SeaweedFS (S3-compatible object storage) ---
  seaweed:
    logging: *bounded-logging
    image: ${EVALDIFF_STAGING_STORAGE_IMAGE:-chrislusf/seaweedfs:4.48}
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    command: server -s3 -dir /data
    volumes:
      - weeddata:/data
    restart: unless-stopped
    healthcheck:
      # seaweed 4.48: S3 ListBuckets on :8333 returns 200 (anonymous is fine for listing)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 15s
      timeout: 5s
      retries: 5
    # S3 listens on :8333, master :8332

  # --- Postgres ---
  db:
    logging: *bounded-logging
    image: ${EVALDIFF_STAGING_DATABASE_IMAGE:-postgres:16-alpine}
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: evaldiff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: evaldiff
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaldiff"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Qualification topology: one API process with an embedded worker scheduler.
  # See OPERATIONS.md before changing process counts or resource budgets.
  api:
    image: ${EVALDIFF_STAGING_IMAGE:?Set the qualified candidate image}
    pull_policy: never
    logging: *bounded-logging
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      EVALDIFF_PRODUCTION: "true"
      EVALDIFF_SECRET_KEY: ${EVALDIFF_SECRET_KEY:?Set a stable Fernet key before deployment}
      EVALDIFF_PREVIOUS_SECRET_KEYS: ${EVALDIFF_PREVIOUS_SECRET_KEYS:-}
      EVALDIFF_DATABASE_URL: postgresql+psycopg://evaldiff:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/evaldiff
      EVALDIFF_S3_ENDPOINT: http://seaweed:8333
      EVALDIFF_S3_ACCESS_KEY: admin
      EVALDIFF_S3_SECRET_KEY: ${SEAWEEFS_SECRET:?SEAWEEFS_SECRET is required}
      EVALDIFF_S3_BUCKET: evaldiff
      EVALDIFF_PUBLIC_BASE_URL: https://${EVALDIFF_STAGING_HOST:?Set the staging hostname}
      EVALDIFF_DEFAULT_QUOTA: "100000"
      EVALDIFF_ENABLE_WORKER: "true"
      EVALDIFF_WORKER_CONCURRENCY: "4"
      EVALDIFF_MAX_ACTIVE_RUNS_PER_ACCOUNT: "2"
      EVALDIFF_MAX_QUEUED_RUNS_PER_ACCOUNT: "10"
      EVALDIFF_MAX_STORAGE_THREADS: "4"
      EVALDIFF_RUN_MAX_SECONDS: "1800"
      EVALDIFF_STORAGE_TIMEOUT: "15"
      EVALDIFF_RATE_LIMIT_RPM: "30"
      EVALDIFF_RATE_LIMIT_BURST: "60"
      EVALDIFF_SIGNUP_RATE_PER_MIN: "5"
      EVALDIFF_SIGNUP_BURST: "5"
      # Caddy fronts this service (reverse_proxy api:8000). Uvicorn's
      # proxy-header middleware trusts X-Forwarded-For only from peers in
      # this range, so request.client resolves to the REAL client (correct
      # per-IP signup rate limiting) and not Caddy's shared container IP.
      # The default bridge network starts at 172.16.0.0/12 — any container
      # on a Docker bridge network falls inside it, and Caddy is the only
      # other peer that talks to this service, so the trust is safe.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    depends_on:
      db:
        condition: service_healthy
      seaweed:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 10

  # --- TLS + proxy ---
  caddy:
    logging: *bounded-logging
    image: caddy:2-alpine
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVALDIFF_STAGING_PROJECT: ${EVALDIFF_STAGING_PROJECT:?Set an isolated staging project}
      EVALDIFF_STAGING_HOST: ${EVALDIFF_STAGING_HOST:?Set the staging hostname}
    volumes:
      - ./qualification/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  weeddata:
  caddydata:
